
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}SAVS | Home{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='SAVS Favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/header.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/text.css')}}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/image.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="navbar">
            <a href="{{ url_for('index') }}" class="logo-link"><img class="logo" src="{{ url_for('static', filename='images/SAVS Full Logo.png') }}" alt="SAVS - Students Against Vaping and Smoking Logo"></a>

            <div class="nav-links">
                <a href="{{ url_for('about') }}" class="{% if request.endpoint == 'about' %}active{% endif %}">About</a>
                <a href="{{ url_for('updates') }}" class="{% if request.endpoint == 'updates' %}active{% endif %}">Updates</a>
                <a href="{{ url_for('schools') }}" class="{% if request.endpoint == 'schools' %}active{% endif %}">Information For Schools</a>
                <a href="{{ url_for('credits') }}" class="{% if request.endpoint == 'credits' %}active{% endif %}">Credits</a>
                <a href="{{ url_for('join') }}" class="joiners {% if request.endpoint == 'join' %}active{% endif %}">Join The Movement</a>            
            </div>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 The SAVS Association NZ. All rights reserved.</p>
    </footer>
</body>
</html>
